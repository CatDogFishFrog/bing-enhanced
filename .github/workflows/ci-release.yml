name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate commit messages
        uses: orhun/git-cliff-action@v4
        with:
          args: --unreleased --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: dist/release-notes-preview.md
      - uses: actions/upload-artifact@v4
        with:
          name: bing-enhanced-user-script
          path: dist/bing-enhanced.user.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: bing-enhanced-user-script
          path: dist
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: dist/release-notes.md
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/bing-enhanced.user.js --notes-file dist/release-notes.md